<!DOCTYPE html>
<html>

<head>
  <title>Blog Preview Card</title>
  <link type="image/x-icon" rel="icon" href="images/favicon-blogcard.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/blogcard.css">  
</head>

<body>
  <div class="container">
    <div>
      <img src="images/illustration-article.svg" class="card-image">
    </div>
    <div class="btn-date">
      <div class="btn">
        <p>Learning</p>
      </div>
      <p class="date">Published 21 Dec 2023</p>
    </div>
    <div class="heading">
      <h3>HTML &#38; CSS foundations</h3>
      <p>These languages are the backbone of every
        website, defining structure, content, and 
        presentation.
      </p>
    </div>
    <div class="profile-box">
      <div class="writer-img-box">
        <img src="images/image-avatar.webp" class="writer-img">
      </div>
      <div class="writer-name-box">
        <p>Greg Hooper</p>
      </div>
    </div>
  </div>
</body>

</html>
